name: Sync GitHub to Gitee

on:
  workflow_dispatch:
    inputs:
      sync_code:
        description: 同步仓库代码（强制同步全部分支和 Tag）
        type: boolean
        default: false
      release_tag:
        description: Release Tag（留空使用最新正式版）
        type: string
        default: ""
      dry_run:
        description: 只检查并预览，不修改 Gitee
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

# 两类事件共用锁，防止代码和发行版相互覆盖。
concurrency:
  group: rimcrow-gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'Inky-Feather/RimCrow' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' && vars.GITEE_AUTO_RELEASE_SYNC == 'true' &&
          !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted workflow code
        # 不执行发布 Tag 中的旧脚本；始终使用默认分支上审核过的同步逻辑。
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install sync dependency
        run: python -m pip install requests==2.34.2

      - name: Sync release and optional repository code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SYNC_CODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.sync_code) || vars.GITEE_SYNC_CODE == 'true' }}
          SYNC_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GITEE_ASSET_PATTERNS: ${{ vars.GITEE_ASSET_PATTERNS }}
          GITEE_MAX_ASSET_BYTES: ${{ vars.GITEE_MAX_ASSET_BYTES || '100000000' }}
        run: python scripts/sync_gitee.py
